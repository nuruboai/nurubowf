<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#173e43">
    <title>箱でつなぐ 承認ワークフロー</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">本文へ移動</a>
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">▣</span>
        <div><p class="eyebrow">ブロック型承認ワークフロー <span class="prototype">試作版</span></p>
          <h1 id="workspace-title">ワークフローを使う</h1>
          <div class="mode-switch" role="group" aria-label="使う・作るの切り替え">
            <button type="button" data-mode="use" aria-pressed="true">使う</button>
            <button type="button" data-mode="build" aria-pressed="false" hidden>作る</button>
          </div></div>
      </div>
      <div class="actor-control">
        <p id="current-person" class="current-person" aria-live="polite"></p>
        <label for="actor">操作する人</label>
        <select id="actor" disabled><option value="">接続後に選べます</option></select>
        <p class="header-note">選んだ人の立場で表示・操作します（タブごとに別の人にできます）</p>
        <div class="button-row two-person-tools"><button type="button" data-command="open-other-tab">もう1人のタブを開く</button><button type="button" data-command="open-pair-view">2人で試す（並べて表示）</button></div>
      </div>
    </header>
    <div class="navigation-bar">
      <nav class="tabs" aria-label="画面の切り替え" role="tablist">
        <button type="button" id="tab-apply" role="tab" aria-controls="main" aria-selected="true" tabindex="0" data-tab="apply" data-workspace="use">起案する</button>
        <button type="button" id="tab-mine" role="tab" aria-controls="main" aria-selected="false" tabindex="-1" data-tab="mine" data-workspace="use">起案した案件</button>
        <button type="button" id="tab-todo" role="tab" aria-controls="main" aria-selected="false" tabindex="-1" data-tab="todo" data-workspace="use">わたしの番</button>
        <button type="button" id="tab-builder" role="tab" aria-controls="main" aria-selected="false" tabindex="-1" data-tab="builder" data-workspace="build" hidden>ルートを組む</button>
        <button type="button" id="tab-settings" role="tab" aria-controls="main" aria-selected="false" tabindex="-1" data-tab="settings" data-workspace="build" hidden>表と設定</button>
        <button type="button" id="tab-admin" role="tab" aria-controls="main" aria-selected="false" tabindex="-1" data-tab="admin" data-workspace="build" hidden>全体の見守り</button>
      </nav>
      <div class="connection"><span id="connection-label">接続を待っています</span><button type="button" class="button-quiet" id="reconnect">再接続</button></div>
    </div>
    <div class="page-shell">
      <p id="progress" class="progress" role="status" hidden>読み込み中です…</p>
      <div id="notice" class="notice" role="status" tabindex="-1" hidden></div>
      <main id="main" role="tabpanel" aria-labelledby="tab-apply" tabindex="-1">
        <section class="empty-state"><h2>仕事の流れを、ひと箱ずつ。</h2><p>起案に使う情報を読み込んでいます。</p></section>
      </main>
    </div>
    <footer>試作版 · 操作する人を切り替えて、申請から承認までの流れを確かめられます。</footer>
    <dialog id="action-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
    <noscript><p class="notice error">この画面を使うには、ブラウザーのJavaScriptを有効にしてください。</p></noscript>
  </body>
</html>
